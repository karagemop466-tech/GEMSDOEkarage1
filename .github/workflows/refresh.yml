name: Check peer source revisions
on:
  workflow_dispatch:
  schedule:
    - cron: '25 9 * * *'
permissions:
  contents: read
jobs:
  revisions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compare public GitHub HEADs to pins (stale or unavailable fails)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check_peer_revisions.py --out .cache/peer-revisions.json
      - name: Save revision check (never changes submission status)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: peer-revision-check
          path: .cache/peer-revisions.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
