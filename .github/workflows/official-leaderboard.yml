name: Refresh official public leaderboard feed
on:
  workflow_dispatch:
  schedule:
    - cron: '25 9 * * *'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Fetch and validate public leaderboard only
        run: python scripts/refresh_official_leaderboard.py
      - name: Rebuild site and run regression suite
        run: |
          python scripts/build_site.py
          python -m pytest -q
      - name: Publish a changed feed snapshot on main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/official-leaderboard.json index.html legacy-overview.html \
            docs/index.html docs/nine-sites.html docs/gpcz/index.html docs/gpcz/nine-sites.html
          if git diff --cached --quiet; then
            echo "The validated public leaderboard snapshot is unchanged."
            exit 0
          fi
          git commit -m "Refresh official public leaderboard snapshot"
          git push
      - name: Keep a branch-dispatch run non-mutating
        if: github.ref != 'refs/heads/main'
        run: echo "Validated the public feed on a non-default branch; no automated commit was made."
